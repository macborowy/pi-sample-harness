openapi: 3.0.3
info:
  title: Pi Sample API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      description: Returns the current API health status.
      operationId: getHealth
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
  /account/me:
    get:
      summary: Current account
      description: Returns the current account profile.
      operationId: getAccountMe
      responses:
        '200':
          description: Current account profile.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - username
                properties:
                  username:
                    type: string
                    enum:
                      - maciej
              example:
                username: maciej
  /api/version:
    get:
      summary: Application version
      description: Returns the configured application version.
      operationId: getApiVersion
      responses:
        '200':
          description: Current application version.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - version
                properties:
                  version:
                    type: string
              example:
                version: 0.0.0
  /api/message:
    get:
      summary: Homepage message
      description: Returns the message displayed on the homepage.
      operationId: getApiMessage
      responses:
        '200':
          description: Homepage message.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message
                properties:
                  message:
                    type: string
                    enum:
                      - Hello
              example:
                message: Hello
  /debug:
    get:
      summary: Debug information
      description: Returns runtime debug information for the API process.
      operationId: getDebug
      responses:
        '200':
          description: Current runtime debug information.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - time
                  - hostname
                  - version
                  - randomNumber
                properties:
                  time:
                    type: string
                    format: date-time
                  hostname:
                    type: string
                  version:
                    type: string
                  randomNumber:
                    type: number
              example:
                time: '2026-09-17T12:00:00.000Z'
                hostname: api-host
                version: 0.0.0
                randomNumber: 0.123456789
