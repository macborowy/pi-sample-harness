openapi: 3.0.3
info:
  title: Pi Sample API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      description: Returns the current API health status.
      operationId: getHealth
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
